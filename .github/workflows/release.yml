name: WatchMyAI Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v2.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: watchmyai-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Install the release environment
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Check the tag matches VERSION
        run: |
          test "${RELEASE_TAG}" = "v$(cat VERSION)"
      - name: Build and verify the release packages
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/utilities/build_release.py
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Extract release notes
        run: |
          VERSION_NUMBER="$(cat VERSION)"
          awk -v v="## v${VERSION_NUMBER}" 'index($0, v) == 1 {found=1; next} found && /^## / {exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --title "WatchMyAI ${RELEASE_TAG} - Version 2" \
              --notes-file release-notes.md \
              --verify-tag
          fi
